packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - vitest@5.1.1
  - '@nestjs/common@11.2.11'
  - '@nestjs/core@11.2.11'
  - '@nestjs/platform-express@11.2.11'
  - '@nestjs/testing@11.2.11'
# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
